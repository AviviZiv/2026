    <style>
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b1120;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #0b1120;
        }

        /* סרגל עליון צף */
        .floating-top-bar {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 7px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            color: #f8fafc;
        }

        .stat-badge {
            display: flex;
            align-items: baseline;
            gap: 5px;
            font-size: 0.82rem;
            color: #94a3b8;
        }

        .stat-badge strong {
            font-size: 1.1rem;
            color: #38bdf8;
            font-weight: 800;
        }

        .btn-refresh {
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background: #0369a1;
            transform: scale(1.03);
        }

        .time-tag {
            font-size: 0.72rem;
            color: #cbd5e1;
            font-family: monospace;
        }

        /* פאנל טבלת היישובים הצף */
        .table-panel {
            position: absolute;
            top: 70px;
            right: 14px;
            width: 360px;
            max-width: calc(100vw - 28px);
            height: calc(100vh - 150px);
            max-height: 650px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .table-panel.collapsed {
            transform: translateX(110%);
            opacity: 0;
            pointer-events: none;
        }

        .panel-header {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .search-box {
            width: 100%;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 12px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
            box-sizing: border-box;
        }

        .search-box:focus {
            border-color: #38bdf8;
        }

        /* כותרות העמודות בטבלה */
        .table-cols-header {
            display: flex;
            justify-content: space-between;
            padding: 7px 14px;
            background: rgba(30, 41, 59, 0.5);
            font-size: 0.72rem;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 600;
        }

        .col-left {
            display: flex;
            gap: 16px;
            text-align: left;
        }

        /* רשימת היישובים הנגללת */
        .table-body {
            flex: 1;
            overflow-y: auto;
            padding: 4px 6px;
        }

        .table-row {
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.15s;
        }

        .table-row:hover {
            background: rgba(56, 189, 248, 0.14);
        }

        .row-city-name {
            font-weight: 600;
            font-size: 0.86rem;
            color: #f8fafc;
        }

        .row-metrics {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* אחוז ההצבעה בפועל */
        .row-turnout {
            font-weight: 700;
            font-size: 0.82rem;
            color: #f1f5f9;
            min-width: 44px;
            text-align: left;
        }

        /* הסטייה באותה שורה בדיוק עם + או - */
        .row-diff {
            font-weight: 700;
            font-size: 0.82rem;
            min-width: 58px;
            text-align: left;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .row-diff.positive {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
        }

        .row-diff.negative {
            color: #93c5fd;
            background: rgba(59, 130, 246, 0.15);
        }

        /* כפתור פתיחה/סגירה צף לרשימה */
        .btn-toggle-table {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* מקרא צף אלגנטי */
        .legend-card {
            background: rgba(15, 23, 42, 0.9) !important;
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            font-size: 0.72rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            min-width: 200px;
        }

        .legend-bar {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #001f54 0%, #0077b6 35%, #90e0ef 48%, #ffffff 50%, #fca5a5 52%, #dc2626 70%, #5a0002 100%);
            margin: 5px 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.62rem;
            color: #94a3b8;
        }

        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            direction: rtl;
            text-align: right;
        }
        .leaflet-popup-tip {
            background: #0f172a;
        }

        @media (max-width: 650px) {
            .floating-top-bar {
                top: 8px;
                right: 8px;
                gap: 8px;
                padding: 6px 12px;
            }
            .btn-toggle-table {
                top: 8px;
                left: 8px;
                padding: 6px 10px;
            }
            .table-panel {
                top: 55px;
                right: 8px;
                left: 8px;
                width: auto;
                height: calc(100vh - 120px);
            }
        }
    </style>

    function getColorByDiff(diff) {
        if (diff < 0) {
            const factor = Math.min(Math.abs(diff) / 22, 1);
            const r = Math.round(144 - factor * 144);
            const g = Math.round(224 - factor * 193);
            const b = Math.round(239 - factor * 155);
            return `rgb(${r}, ${g}, ${b})`;
        } else {
            const factor = Math.min(diff / 22, 1);
            const r = Math.round(252 - factor * 162);
            const g = Math.round(165 - factor * 165);
            const b = Math.round(165 - factor * 163);
            return `rgb(${r}, ${g}, ${b})`;
        }
    }

    function updateTimestamp() {
        const now = new Date();
        document.getElementById('lastUpdateDisplay').innerText = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function initMap() {
        if (typeof L === 'undefined') return;

        map = L.map('map', {
            center: [31.5, 34.9],
            zoom: 8,
            minZoom: 7,
            maxZoom: 16,
            zoomControl: false
        });

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        markersLayer = L.layerGroup().addTo(map);

        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function() {
            const div = L.DomUtil.create('div', 'legend-card');
            div.innerHTML = `
                <div><strong>יחס לממוצע הארצי (<span id="legend-avg">--%</span>)</strong></div>
                <div class="legend-bar"></div>
                <div class="legend-labels">
                    <span>כחול (נמוך)</span>
                    <span>ממוצע</span>
                    <span>אדום (גבוה)</span>
                </div>
            `;
            return div;
        };
        legend.addTo(map);

        renderData();
        updateTimestamp();

        window.addEventListener('resize', () => map.invalidateSize());
        setTimeout(() => map.invalidateSize(), 300);
    }

    function renderData() {
        if (!markersLayer) return;

        const totalEligible = authorities.reduce((acc, c) => acc + c.eligible, 0);
        const totalVoted = authorities.reduce((acc, c) => acc + c.voted, 0);
        const nationalAvg = (totalVoted / totalEligible) * 100;

        document.getElementById('disp-avg').innerText = nationalAvg.toFixed(1) + '%';
        document.getElementById('disp-count').innerText = authorities.length;
        const legendAvg = document.getElementById('legend-avg');
        if (legendAvg) legendAvg.innerText = nationalAvg.toFixed(1) + '%';

        markersLayer.clearLayers();
        markersMap.clear();

        authorities.forEach(city => {
            const turnout = (city.voted / city.eligible) * 100;
            const diff = turnout - nationalAvg;
            const color = getColorByDiff(diff);
            const radius = Math.max(6, Math.min(18, Math.sqrt(city.eligible) / 32));

            const circle = L.circleMarker([city.lat, city.lng], {
                radius: radius,
                fillColor: color,
                color: '#ffffff',
                weight: 1.5,
                opacity: 0.9,
                fillOpacity: 0.85
            });

            const diffText = diff >= 0 ? `+${diff.toFixed(1)}%` : `${diff.toFixed(1)}%`;
            circle.bindPopup(`
                <div style="min-width: 140px;">
                    <h3 style="margin-bottom: 4px; font-size: 1rem;">${city.name}</h3>
                    <div>שיעור הצבעה: <b>${turnout.toFixed(1)}%</b></div>
                    <div style="color: ${diff >= 0 ? '#ef4444' : '#38bdf8'}; font-weight: bold; margin-top:2px;">
                        סטייה מהממוצע: ${diffText}
                    </div>
                    <div style="color: #94a3b8; font-size: 0.7rem; margin-top: 5px;">
                        בעלי זכות: ${city.eligible.toLocaleString('he-IL')}<br/>
                        הצביעו: ${city.voted.toLocaleString('he-IL')}
                    </div>
                </div>
            `);

            markersLayer.addLayer(circle);
            markersMap.set(city.name, { marker: circle, data: city, turnout, diff, color });
        });

        renderTable();
    }

    // מילוי טבלת היישובים
    function renderTable() {
        const query = document.getElementById('searchInput').value.trim();
        const body = document.getElementById('tableBody');
        body.innerHTML = '';

        // מיון הרשויות מהגבוה לנמוך לפי אחוז ההצבעה
        const sorted = [...authorities].sort((a,b) => (b.voted / b.eligible) - (a.voted / a.eligible));
        const filtered = sorted.filter(c => c.name.includes(query));

        document.getElementById('filteredCount').innerText = `${filtered.length} רשויות`;

        filtered.forEach(city => {
            const item = markersMap.get(city.name);
            const isPos = item.diff >= 0;
            const diffSign = isPos ? '+' : '';
            const diffClass = isPos ? 'positive' : 'negative';

            const row = document.createElement('div');
            row.className = 'table-row';
            row.innerHTML = `
                <span class="row-city-name">${city.name}</span>
                <div class="row-metrics">
                    <span class="row-turnout">${item.turnout.toFixed(1)}%</span>
                    <span class="row-diff ${diffClass}">${diffSign}${item.diff.toFixed(1)}%</span>
                </div>
            `;

            row.onclick = () => {
                map.flyTo([city.lat, city.lng], 12, { duration: 1.2 });
                item.marker.openPopup();
                // במסכים קטנים נסגור את הטבלה כדי לראות את המפה
                if (window.innerWidth <= 650) {
                    document.getElementById('tablePanel').classList.add('collapsed');
                }
            };

            body.appendChild(row);
        });
    }

    // חיפוש בטבלה
    document.getElementById('searchInput').addEventListener('input', renderTable);

    // פתיחה וסגירה של טבלת היישובים
    document.getElementById('toggleTableBtn').addEventListener('click', () => {
        const panel = document.getElementById('tablePanel');
        panel.classList.toggle('collapsed');
    });

    // כפתור רענן נתונים
    document.getElementById('refreshBtn').addEventListener('click', () => {
        const btn = document.getElementById('refreshBtn');
        btn.innerText = 'מרענן...';
        btn.style.opacity = '0.7';

        authorities.forEach(c => {
            const remaining = c.eligible - c.voted;
            if (remaining > 0) {
                c.voted += Math.floor(Math.random() * (remaining * 0.04));
            }
        });

        setTimeout(() => {
            renderData();
            updateTimestamp();
            btn.innerText = 'רענן ⟳';
            btn.style.opacity = '1';
        }, 250);
    });

    window.addEventListener('DOMContentLoaded', initMap);
</script>

</body>
